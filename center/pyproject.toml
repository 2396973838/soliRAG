[project]
name = "solirag-center"
version = "0.1.0"
description = "soliRAG 联邦知识库 · 中心（控制面）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 本机沙箱不允许写系统 Temp 与 .pytest_cache，因此关掉缓存（测试本身不落盘）
addopts = "-q -p no:cacheprovider"
